name: Verify FeedInk
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: Final full browser, container and storage acceptance
        type: boolean
        default: false
      storage_acceptance:
        description: Targeted container and S3 recovery acceptance
        type: boolean
        default: false
      scale_tier:
        description: Optional synthetic single-owner scale rehearsal
        type: choice
        options: ['none', '10000', '100000', '1000000', 'all']
        default: 'none'
      scale_search_mode:
        description: Indexed release workload or historical index comparison
        type: choice
        options: [indexed, compare, before]
        default: indexed
      scale_mcp_prepared:
        description: Inspect actual same-connection prepared execution
        type: boolean
        default: false
      publish_scale_evidence:
        description: Publish only structured synthetic scale evidence
        type: boolean
        default: false
      compare_search_indexes:
        description: Compare search indexes on the 10000 tier only
        type: boolean
        default: false
permissions:
  contents: read
env:
  FULL_ACCEPTANCE: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' || inputs.full_acceptance) && 'true' || 'false' }}
concurrency:
  group: feedink-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: feedink_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: feedink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedink_ci -d feedink_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      VITE_BUILD_REVISION: ${{ github.sha }}
      BROWSER_MATRIX: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' || inputs.full_acceptance) && 'chromium webkit' || 'chromium' }}
      DATABASE_URL: postgresql://feedink_ci:ephemeral_ci_only@127.0.0.1:5432/feedink_ci
      TEST_DATABASE_URL: postgresql://feedink_ci:ephemeral_ci_only@127.0.0.1:5432/feedink_ci
      SEARCH_INDEXES_TEST: '1'
      DATA_DIR: ${{ github.workspace }}/.data/ci
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      FEEDINK_FIXTURE_URL: http://127.0.0.1:8899
      FEEDINK_FIXTURE_PORT: '8899'
      FEEDINK_TEST_WEBKIT: '1'
      FETCH_ALLOW_HOSTS: 127.0.0.1
      SESSION_SECRET: ephemeral-ci-session-secret-not-for-production-0001
      REGISTRATION_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - name: Check public source hygiene
        run: |
          node scripts/check-public-content.mjs
          node --test scripts/check-public-content.test.mjs
      - run: npm ci --no-audit --no-fund
      - name: Record validation profile
        run: |
          if [ "$FULL_ACCEPTANCE" = true ]; then
            echo 'Full acceptance profile; runtime publication requires every gate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Development profile: core unit/API and Chromium gates; no runtime bundle or deployment approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Production build (ink → shared → web → API)
        id: build
        run: npm run build
      - name: Package development preview after successful build
        if: ${{ success() && env.FULL_ACCEPTANCE != 'true' }}
        run: node scripts/package-runtime.mjs
      - name: Publish development preview bundle
        if: ${{ success() && env.FULL_ACCEPTANCE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: feedink-preview-${{ github.sha }}
          path: .artifacts/runtime/
          retention-days: 7
          if-no-files-found: error
      - name: Prepare the owned CI data root
        run: |
          node --input-type=module <<'JS'
          import { durableDirectory } from './apps/api/dist/storage/backend.js';
          await durableDirectory(process.env.DATA_DIR, process.env.GITHUB_WORKSPACE);
          JS
      - name: Typecheck workspaces and test contracts
        id: contracts
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --skipLibCheck --esModuleInterop --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM apps/api/test/ai*.ts
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Unit, PostgreSQL integration and upstream fixture tests
        timeout-minutes: 15
        env:
          NODE_ENV: test
        run: npm test
      - name: Backup format tests and shell syntax
        run: |
          node --test scripts/data-archive.test.mjs
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Install browser for existing end-to-end tests
        id: browsers
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.contracts.outcome == 'success' && hashFiles('tests/e2e/*.spec.ts') != '' }}
        run: npx playwright install --with-deps $BROWSER_MATRIX
      - name: Install PDF verification tools
        id: pdf
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
      - name: Client lifecycle and privacy regressions
        id: client
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' && steps.pdf.outcome == 'success' }}
        continue-on-error: true
        run: |
          failed=0
          for browser in $BROWSER_MATRIX; do
            for suite in browser audit shell images offline-origin annotations ai; do
              if ! FEEDINK_BROWSER="$browser" npm run "test:$suite" -w @feedink/web; then failed=1; fi
            done
          done
          if ! npm run test:residual -w @feedink/web; then failed=1; fi
          test "$failed" = 0
      - name: Browser and API end-to-end tests
        id: e2e
        continue-on-error: true
        # Collect independent browser evidence even if a unit fails; any failure still blocks packaging.
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' && steps.pdf.outcome == 'success' && hashFiles('tests/e2e/*.spec.ts') != '' }}
        run: |
          failed=0
          projects='api desktop mobile mcp'
          annotation_projects='annotations annotations-mobile'
          if [ "$FULL_ACCEPTANCE" = true ]; then
            projects='api desktop mobile tablet webkit workflows mcp'
            annotation_projects='annotations annotations-mobile annotations-webkit'
          fi
          for project in $projects; do
            if ! PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$project" node tests/run-project.mjs "$project"; then
              failed=1
            fi
          done
          # Each batch owns a fresh API/rate budget; one worker keeps shared fixture controls isolated.
          # Keep every shard result, even after an earlier failure; raw reports stay ephemeral.
          for project in $annotation_projects; do
            for shard in 1 2 3 4; do
              batch="$project-shard-$shard-of-4"
              echo "::group::$batch"
              if PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$batch" node tests/run-project.mjs "$project" "--shard=$shard/4"; then
                echo "$batch: passed" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "$batch: failed" >> "$GITHUB_STEP_SUMMARY"
                failed=1
              fi
              echo '::endgroup::'
            done
          done
          test "$failed" = 0
      - name: Require both browser acceptance gates
        if: always()
        run: |
          test '${{ steps.client.outcome }}' = success
          test '${{ steps.e2e.outcome }}' = success
      - name: Package reviewed runtime code
        if: ${{ success() && env.FULL_ACCEPTANCE == 'true' }}
        run: |
          node --test scripts/package-runtime.test.mjs
          node scripts/package-runtime.mjs
      - name: Publish code-only runtime bundle
        if: ${{ success() && env.FULL_ACCEPTANCE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: feedink-runtime-${{ github.sha }}
          path: .artifacts/runtime/
          retention-days: 7
          if-no-files-found: error
      # Only checked runtime code is uploaded, never traces, sessions, environment files or data.

  container:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' || inputs.full_acceptance || inputs.storage_acceptance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Build the actual production image
        run: docker build --tag feedink:ci .
      - name: Compose health, migration and restart smoke
        run: |
          umask 077
          {
            echo 'COMPOSE_PROJECT_NAME=feedink-ci'
            echo 'FEEDINK_IMAGE=feedink:ci'
            echo 'APP_URL=https://localhost:3443'
            echo 'ADMIN_EMAIL=operator-ci@example.invalid'
            echo 'ADMIN_NAME=CI operator'
            echo 'REGISTRATION_ENABLED=false'
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)"
          } > .env
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120 postgres
          export TRUST_PROXY="$(docker network inspect feedink-ci_default --format '{{(index .IPAM.Config 0).Gateway}}')"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$RUNNER_TEMP/tls.key" -out "$RUNNER_TEMP/tls.crt" -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' > /dev/null 2>&1
          export NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/tls.crt"
          TEST_TLS_CERT="$RUNNER_TEMP/tls.crt" TEST_TLS_KEY="$RUNNER_TEMP/tls.key" node tests/fixtures/deployment-tls-proxy.mjs > "$RUNNER_TEMP/tls-proxy.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/tls-proxy.pid"
          openssl rand -base64 32 > "$RUNNER_TEMP/admin-password"
          docker compose run --rm --no-deps -T -e ADMIN_PASSWORD_FILE=/dev/stdin --entrypoint npm app run bootstrap-admin -w @feedink/api < "$RUNNER_TEMP/admin-password"
          if docker compose run --rm --no-deps -T -e ADMIN_PASSWORD_FILE=/dev/stdin --entrypoint npm app run bootstrap-admin -w @feedink/api < "$RUNNER_TEMP/admin-password" > "$RUNNER_TEMP/bootstrap-refusal.log" 2>&1; then
            echo 'Repeated administrator bootstrap unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'Bootstrap requires an unused email and no active administrator' "$RUNNER_TEMP/bootstrap-refusal.log" > /dev/null
          docker compose up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:3000/api/health
          BASE_URL=https://localhost:3443 ADMIN_EMAIL=operator-ci@example.invalid ADMIN_PASSWORD_FILE="$RUNNER_TEMP/admin-password" MCP_STATE_FILE="$RUNNER_TEMP/mcp-state.json" node scripts/test-deployment.mjs bootstrap
          export BASE_URL=https://localhost:3443 STATE_FILE="$RUNNER_TEMP/deployment-state.json"
          node scripts/test-deployment.mjs seed
          docker compose restart app
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          node scripts/test-deployment.mjs verify
      - name: Application database and image-volume recovery into a fresh project
        run: |
          export COMPOSE_PROJECT_NAME=feedink-ci
          docker compose stop app
          scripts/backup.sh "$RUNNER_TEMP/application-backup"
          export COMPOSE_PROJECT_NAME=feedink-ci-recovery APP_PORT=3001 APP_URL=https://localhost:3444
          export NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/tls.crt"
          docker compose up -d --wait --wait-timeout 120 postgres
          export TRUST_PROXY="$(docker network inspect feedink-ci-recovery_default --format '{{(index .IPAM.Config 0).Gateway}}')"
          scripts/restore.sh "$RUNNER_TEMP/application-backup" --confirm-restore=feedink-ci-recovery
          docker compose up -d --wait --wait-timeout 120
          BASE_URL=https://localhost:3444 STATE_FILE="$RUNNER_TEMP/deployment-state.json" node scripts/test-deployment.mjs verify
          BASE_URL=https://localhost:3444 ADMIN_EMAIL=operator-ci@example.invalid ADMIN_PASSWORD_FILE="$RUNNER_TEMP/admin-password" MCP_STATE_FILE="$RUNNER_TEMP/mcp-state.json" node scripts/test-deployment.mjs bootstrap
      - name: Real PostgreSQL plus independent archive volume failure-guard drill
        env:
          TEST_IMAGE: feedink:ci
        run: scripts/test-backup.sh
      - name: Referenced-blob paired recovery and corruption refusal
        env:
          TEST_IMAGE: feedink:ci
        run: scripts/test-storage-backup.sh
      # Keep raw diagnostic files ephemeral; publish only reviewed summaries.

  storage:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' || inputs.full_acceptance || inputs.storage_acceptance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: feedink_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: feedink_storage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedink_ci -d feedink_storage"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      TEST_STORAGE_DATABASE_URL: postgresql://feedink_ci:ephemeral_ci_only@127.0.0.1:5432/feedink_storage
      TEST_STORAGE_BACKEND: s3
      TEST_STORAGE_S3_BUCKET: feedink-storage-ci
      TEST_STORAGE_S3_REGION: us-east-1
      TEST_STORAGE_S3_ENDPOINT: http://127.0.0.1:19000
      TEST_STORAGE_S3_PREFIX: acceptance/
      TEST_STORAGE_S3_FORCE_PATH_STYLE: 'true'
      TEST_STORAGE_S3_ALLOW_HTTP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build storage runtime and shared contracts
        run: |
          npm run build -w @feedink/ink
          npm run build -w @feedink/shared
          npm run build -w @feedink/api
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.2'
          cache: false
      - name: Build fixed public-source S3 protocol fixture
        timeout-minutes: 10
        run: sh scripts/build-s3-fixture.sh
      - name: Start private synthetic S3 fixture
        run: |
          access_key="fixture$(openssl rand -hex 8)"
          secret_key="$(openssl rand -hex 24)"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          bridge_gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$bridge_gateway"
          docker run --detach --name feedink-s3-ci --publish 127.0.0.1:19000:9000 --publish "$bridge_gateway:19000:9000" \
            --env "MINIO_ROOT_USER=$access_key" --env "MINIO_ROOT_PASSWORD=$secret_key" \
            feedink-s3-fixture:ci server /data
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - name: Create isolated fixture bucket
        run: |
          node --input-type=module <<'JS'
          import { S3Client, CreateBucketCommand } from '@aws-sdk/client-s3';
          const client = new S3Client({ region: process.env.TEST_STORAGE_S3_REGION, endpoint: process.env.TEST_STORAGE_S3_ENDPOINT, forcePathStyle: true, maxAttempts: 1 });
          try { await client.send(new CreateBucketCommand({ Bucket: process.env.TEST_STORAGE_S3_BUCKET })); }
          finally { client.destroy(); }
          JS
      - name: Storage durability, ownership, stream and process-recovery acceptance
        run: |
          npm exec -w @feedink/api -- tsx --test --test-concurrency=1 \
            test/storage.test.ts test/storage-durability.test.ts test/storage-stream.test.ts \
            test/storage-s3.test.ts test/storage-bundle.test.ts test/storage-postgres.test.ts \
            test/storage-http.test.ts test/storage-process.test.ts
      - name: Build production image for private S3 paired recovery
        run: docker build --tag feedink:storage-ci .
      - name: Paired PostgreSQL restore into private S3 with runtime restrictions
        env:
          TEST_IMAGE: feedink:storage-ci
          STORAGE_RESTORE_BACKEND: s3
          TEST_STORAGE_S3_ENDPOINT: http://host.docker.internal:19000
        run: scripts/test-storage-backup.sh
      - name: Paired backup from private S3 into fresh filesystem
        timeout-minutes: 10
        env:
          TEST_IMAGE: feedink:storage-ci
          STORAGE_SOURCE_BACKEND: s3
          STORAGE_RESTORE_BACKEND: filesystem
          TEST_STORAGE_S3_ENDPOINT: http://host.docker.internal:19000
        run: scripts/test-storage-backup.sh
      - name: Interrupted S3-source backup and fresh-target recovery
        timeout-minutes: 10
        env:
          TEST_IMAGE: feedink:storage-ci
          STORAGE_SOURCE_BACKEND: s3
          STORAGE_RESTORE_BACKEND: s3
          STORAGE_S3_INTERRUPTION: 'true'
          TEST_STORAGE_S3_ENDPOINT: http://host.docker.internal:19000
        run: scripts/test-storage-backup.sh
      - name: Stop owned synthetic S3 fixture
        if: always()
        run: docker rm --force feedink-s3-ci >/dev/null 2>&1 || true

  scale:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scale_tier != 'none' }}
    uses: ./.github/workflows/scale.yml
    with:
      tier: ${{ inputs.scale_tier || '10000' }}
      publish_evidence: ${{ inputs.publish_scale_evidence || false }}
      search_indexes: ${{ inputs.compare_search_indexes || false }}
      search_mode: ${{ inputs.scale_search_mode || 'indexed' }}
      mcp_prepared: ${{ inputs.scale_mcp_prepared || false }}
