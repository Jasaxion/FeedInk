name: Verify FeedInk
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feedink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: feedink_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: feedink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedink_ci -d feedink_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      DATABASE_URL: postgresql://feedink_ci:ephemeral_ci_only@127.0.0.1:5432/feedink_ci
      TEST_DATABASE_URL: postgresql://feedink_ci:ephemeral_ci_only@127.0.0.1:5432/feedink_ci
      DATA_DIR: ${{ github.workspace }}/.data/ci
      APP_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      FEEDINK_FIXTURE_URL: http://127.0.0.1:8899
      FEEDINK_FIXTURE_PORT: '8899'
      FEEDINK_TEST_WEBKIT: '1'
      FETCH_ALLOW_HOSTS: 127.0.0.1
      SESSION_SECRET: ephemeral-ci-session-secret-not-for-production-0001
      REGISTRATION_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - name: Check public source hygiene
        run: |
          node scripts/check-public-content.mjs
          node --test scripts/check-public-content.test.mjs
      - run: npm ci --no-audit --no-fund
      - name: Production build (ink → shared → web → API)
        run: npm run build
      - name: Typecheck workspaces and test contracts
        run: npm run typecheck
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Unit, PostgreSQL integration and upstream fixture tests
        env:
          NODE_ENV: test
        run: npm test
      - name: Backup format tests and shell syntax
        run: |
          node --test scripts/data-archive.test.mjs
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Install browser for existing end-to-end tests
        if: ${{ hashFiles('tests/e2e/*.spec.ts') != '' }}
        run: npx playwright install --with-deps chromium webkit
      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
      - name: Client lifecycle and privacy regressions
        run: |
          failed=0
          for browser in chromium webkit; do
            for suite in browser audit shell images offline-origin annotations; do
              if ! FEEDINK_BROWSER="$browser" npm run "test:$suite" -w @feedink/web; then failed=1; fi
            done
          done
          if ! npm run test:residual -w @feedink/web; then failed=1; fi
          test "$failed" = 0
      - name: Browser and API end-to-end tests
        if: ${{ hashFiles('tests/e2e/*.spec.ts') != '' }}
        run: |
          failed=0
          for project in api desktop mobile tablet webkit workflows mcp annotations annotations-mobile annotations-webkit; do
            if ! PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$project" node tests/run-project.mjs "$project"; then
              failed=1
            fi
          done
          test "$failed" = 0
      - name: Package reviewed runtime code
        run: |
          node --test scripts/package-runtime.test.mjs
          node scripts/package-runtime.mjs
      - name: Publish code-only runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: feedink-runtime-${{ github.sha }}
          path: .artifacts/runtime/
          retention-days: 7
          if-no-files-found: error
      # Only checked runtime code is uploaded, never traces, sessions, environment files or data.

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Build the actual production image
        run: docker build --tag feedink:ci .
      - name: Compose health, migration and restart smoke
        run: |
          umask 077
          {
            echo 'COMPOSE_PROJECT_NAME=feedink-ci'
            echo 'FEEDINK_IMAGE=feedink:ci'
            echo 'APP_URL=https://localhost:3443'
            echo 'ADMIN_EMAIL=operator-ci@example.invalid'
            echo 'ADMIN_NAME=CI operator'
            echo 'REGISTRATION_ENABLED=false'
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)"
          } > .env
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120 postgres
          export TRUST_PROXY="$(docker network inspect feedink-ci_default --format '{{(index .IPAM.Config 0).Gateway}}')"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$RUNNER_TEMP/tls.key" -out "$RUNNER_TEMP/tls.crt" -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' > /dev/null 2>&1
          export NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/tls.crt"
          TEST_TLS_CERT="$RUNNER_TEMP/tls.crt" TEST_TLS_KEY="$RUNNER_TEMP/tls.key" node tests/fixtures/deployment-tls-proxy.mjs > "$RUNNER_TEMP/tls-proxy.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/tls-proxy.pid"
          openssl rand -base64 32 > "$RUNNER_TEMP/admin-password"
          docker compose run --rm --no-deps -T -e ADMIN_PASSWORD_FILE=/dev/stdin --entrypoint npm app run bootstrap-admin -w @feedink/api < "$RUNNER_TEMP/admin-password"
          if docker compose run --rm --no-deps -T -e ADMIN_PASSWORD_FILE=/dev/stdin --entrypoint npm app run bootstrap-admin -w @feedink/api < "$RUNNER_TEMP/admin-password" > "$RUNNER_TEMP/bootstrap-refusal.log" 2>&1; then
            echo 'Repeated administrator bootstrap unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'Bootstrap requires an unused email and no active administrator' "$RUNNER_TEMP/bootstrap-refusal.log" > /dev/null
          docker compose up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:3000/api/health
          BASE_URL=https://localhost:3443 ADMIN_EMAIL=operator-ci@example.invalid ADMIN_PASSWORD_FILE="$RUNNER_TEMP/admin-password" MCP_STATE_FILE="$RUNNER_TEMP/mcp-state.json" node scripts/test-deployment.mjs bootstrap
          export BASE_URL=https://localhost:3443 STATE_FILE="$RUNNER_TEMP/deployment-state.json"
          node scripts/test-deployment.mjs seed
          docker compose restart app
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          node scripts/test-deployment.mjs verify
      - name: Application database and image-volume recovery into a fresh project
        run: |
          export COMPOSE_PROJECT_NAME=feedink-ci
          docker compose stop app
          scripts/backup.sh "$RUNNER_TEMP/application-backup"
          export COMPOSE_PROJECT_NAME=feedink-ci-recovery APP_PORT=3001 APP_URL=https://localhost:3444
          export NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/tls.crt"
          docker compose up -d --wait --wait-timeout 120 postgres
          export TRUST_PROXY="$(docker network inspect feedink-ci-recovery_default --format '{{(index .IPAM.Config 0).Gateway}}')"
          scripts/restore.sh "$RUNNER_TEMP/application-backup" --confirm-restore=feedink-ci-recovery
          docker compose up -d --wait --wait-timeout 120
          BASE_URL=https://localhost:3444 STATE_FILE="$RUNNER_TEMP/deployment-state.json" node scripts/test-deployment.mjs verify
          BASE_URL=https://localhost:3444 ADMIN_EMAIL=operator-ci@example.invalid ADMIN_PASSWORD_FILE="$RUNNER_TEMP/admin-password" MCP_STATE_FILE="$RUNNER_TEMP/mcp-state.json" node scripts/test-deployment.mjs bootstrap
      - name: Real PostgreSQL plus independent archive volume failure-guard drill
        env:
          TEST_IMAGE: feedink:ci
        run: scripts/test-backup.sh
      # Keep raw diagnostic files ephemeral; publish only reviewed summaries.
